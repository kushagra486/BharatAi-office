<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="320" height="320"></canvas>
<script type="importmap">
{"imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const modelUrl = params.get('model');
const angle = parseFloat(params.get('angle') || '25');
const height = parseFloat(params.get('camy') || '1.55');
const dist = parseFloat(params.get('dist') || '2.9');
const lookY = parseFloat(params.get('looky') || '1.45');

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(320, 320, false);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
const rad = THREE.MathUtils.degToRad(angle);
camera.position.set(Math.sin(rad) * dist, height, Math.cos(rad) * dist);
camera.lookAt(0, lookY, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3f55, 1.3));
const dir1 = new THREE.DirectionalLight(0xffffff, 1.1);
dir1.position.set(2, 3, 2);
scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0x8899ff, 0.4);
dir2.position.set(-2, 1, -2);
scene.add(dir2);

window.__status = 'loading';
const loader = new GLTFLoader();
loader.load(
  modelUrl,
  (gltf) => {
    scene.add(gltf.scene);
    renderer.render(scene, camera);
    window.__status = 'rendered';
  },
  undefined,
  (err) => {
    window.__status = 'error';
    window.__error = String(err && err.message ? err.message : err);
  }
);
</script>
</body>
</html>
